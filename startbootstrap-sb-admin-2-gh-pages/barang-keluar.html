<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="Input Barang Keluar - Han Repair">

    <title>Han Repair - Barang Keluar</title>

    <link href="vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">
    <link href="css/han-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
        rel="stylesheet">
    <link href="css/sb-admin-2.min.css" rel="stylesheet">
    <link href="css/han.css" rel="stylesheet">

</head>

<body id="page-top">

    <div id="wrapper">

        <ul class="navbar-nav bg-gradient-primary sidebar sidebar-dark accordion" id="accordionSidebar"></ul>

        <div id="content-wrapper" class="d-flex flex-column">

            <div id="content">

                <nav class="navbar navbar-expand navbar-light bg-white topbar mb-4 static-top shadow" id="topbar"></nav>

                <div class="container-fluid">

                    <div class="d-sm-flex align-items-center justify-content-between mb-4">
                        <h1 class="h3 mb-0 text-gray-800">Barang Keluar</h1>
                    </div>

                    <div class="card shadow mb-4">
                        <div class="card-header py-3 d-flex align-items-center justify-content-between">
                            <h6 class="m-0 font-weight-bold text-primary">Riwayat Barang Keluar</h6>
                            <div class="d-flex align-items-center">
                                <input type="text" class="form-control form-control-sm mr-2" style="width:200px;"
                                    id="cari" placeholder="Cari barang...">
                                <button class="btn btn-primary btn-sm text-nowrap" id="btnTambah">
                                    <i class="fas fa-plus mr-1"></i> Tambah
                                </button>
                            </div>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-han table-bordered" width="100%" cellspacing="0">
                                    <thead class="thead-light">
                                        <tr>
                                            <th>Tanggal</th>
                                            <th>Barang</th>
                                            <th class="text-right">Jumlah</th>
                                            <th class="text-right">Harga</th>
                                            <th class="text-right">Total</th>
                                            <th>Pelanggan</th>
                                            <th class="text-center">Aksi</th>
                                        </tr>
                                    </thead>
                                    <tbody id="tbody"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                </div>

            </div>

            <footer class="sticky-footer bg-white">
                <div class="container my-auto">
                    <div class="copyright text-center my-auto">
                        <span>Copyright &copy; <span id="footerYear"></span> Han Repair</span>
                    </div>
                </div>
            </footer>

        </div>

    </div>

    <div class="modal fade" id="formModal" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <form id="formKeluar">
                    <div class="modal-header">
                        <h5 class="modal-title" id="formTitle">Tambah Barang Keluar</h5>
                        <button class="close" type="button" data-dismiss="modal"><span>&times;</span></button>
                    </div>
                    <div class="modal-body">
                        <div id="alert" class="alert alert-danger py-2 d-none"></div>
                        <div class="form-group">
                            <label class="small font-weight-bold">Tanggal</label>
                            <input type="date" class="form-control" id="tanggal" required>
                        </div>
                        <div class="form-group">
                            <label class="small font-weight-bold">Barang</label>
                            <select class="form-control" id="kode" required></select>
                            <small class="text-muted">Stok tersedia: <span id="infoStok">-</span></small>
                        </div>
                        <div class="form-row">
                            <div class="form-group col-6">
                                <label class="small font-weight-bold">Jumlah</label>
                                <input type="number" min="1" class="form-control" id="jumlah" value="1" required>
                            </div>
                            <div class="form-group col-6">
                                <label class="small font-weight-bold">Harga Jual/Unit</label>
                                <input type="number" min="0" class="form-control" id="hargaJual" value="0" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="small font-weight-bold">Pelanggan</label>
                            <input type="text" class="form-control" id="pelanggan" placeholder="Nama pelanggan / Umum">
                        </div>
                        <div class="form-group mb-0">
                            <label class="small font-weight-bold">Keterangan</label>
                            <input type="text" class="form-control" id="ket" placeholder="Opsional">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-secondary" type="button" data-dismiss="modal">Batal</button>
                        <button class="btn btn-primary" type="submit"><i class="fas fa-save mr-1"></i> Simpan</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <a class="scroll-to-top rounded" href="#page-top"><i class="fas fa-angle-up"></i></a>
    <div id="logout-modal"></div>

    <script src="vendor/jquery/jquery.min.js"></script>
    <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="vendor/jquery-easing/jquery.easing.min.js"></script>
    <script src="js/han-app.js"></script>
    <script>
        Han.layout("barang-keluar.html");

        var editId = null;

        function infoStok() {
            var kode = $("#kode").val();
            if (!kode) { $("#infoStok").text("-"); return; }
            var b = Han.getBarang(kode);
            if (b && Han.isJasa(b)) { $("#infoStok").text("Jasa (tanpa stok)"); return; }
            $("#infoStok").text(Han.stokOf(kode) + " " + (b ? b.satuan : ""));
        }

        function render() {
            var cari = $("#cari").val().toLowerCase();
            var data = Han.listKeluar().slice().sort(function (a, b) { return a.tanggal < b.tanggal ? 1 : -1; });
            var rows = "";
            var total = 0;
            data.forEach(function (k) {
                var b = Han.getBarang(k.kode);
                var nama = b ? b.nama : k.kode;
                if (cari && (nama + " " + (k.pelanggan || "")).toLowerCase().indexOf(cari) === -1) return;
                var nilai = Han.num(k.jumlah) * Han.num(k.hargaJual);
                total += nilai;
                rows += '<tr>' +
                    '<td>' + Han.fmtDate(k.tanggal) + '</td>' +
                    '<td>' + Han.escapeHtml(nama) + '</td>' +
                    '<td class="text-right">' + k.jumlah + '</td>' +
                    '<td class="text-right rupiah">' + Han.money(k.hargaJual) + '</td>' +
                    '<td class="text-right rupiah">' + Han.money(nilai) + '</td>' +
                    '<td>' + Han.escapeHtml(k.pelanggan || "-") + '</td>' +
                    '<td class="text-center text-nowrap">' +
                    '<button class="btn btn-sm btn-info btn-edit" data-id="' + k.id + '" title="Ubah"><i class="fas fa-edit"></i></button> ' +
                    '<button class="btn btn-sm btn-danger btn-hapus" data-id="' + k.id + '" title="Hapus"><i class="fas fa-trash"></i></button>' +
                    '</td></tr>';
            });
            if (!rows) {
                rows = '<tr><td colspan="7" class="text-center text-muted">Belum ada data. Klik tombol Tambah untuk mengisi.</td></tr>';
            } else {
                rows += '<tr class="font-weight-bold bg-light"><td colspan="4" class="text-right">TOTAL</td>' +
                    '<td class="text-right rupiah">' + Han.money(total) + '</td><td colspan="2"></td></tr>';
            }
            $("#tbody").html(rows);
        }

        function resetForm() {
            editId = null;
            $("#formKeluar")[0].reset();
            $("#tanggal").val(Han.todayISO());
            $("#jumlah").val(1);
            $("#hargaJual").val(0);
            $("#kode").html(Han.barangOptions(""));
            infoStok();
            $("#formTitle").text("Tambah Barang Keluar");
            $("#alert").addClass("d-none");
        }

        function tersedia(kode) {
            var b = Han.getBarang(kode);
            if (b && Han.isJasa(b)) return Infinity;
            var s = Han.stokOf(kode);
            if (editId) {
                var asli = Han.listKeluar().filter(function (x) { return String(x.id) === String(editId); })[0];
                if (asli && String(asli.kode) === String(kode)) s += Han.num(asli.jumlah);
            }
            return s;
        }

        $("#btnTambah").on("click", function () {
            resetForm();
            $("#formModal").modal("show");
        });

        $("#formKeluar").on("submit", function (e) {
            e.preventDefault();
            var kode = $("#kode").val();
            var jumlah = Han.num($("#jumlah").val());
            if (jumlah > tersedia(kode)) {
                $("#alert").removeClass("d-none").text("Stok tidak cukup. Stok tersedia: " + tersedia(kode) + ".");
                return;
            }
            var b = Han.getBarang(kode);
            var rec = {
                id: editId || Han.uid(),
                tanggal: $("#tanggal").val(),
                kode: kode,
                jumlah: jumlah,
                hargaJual: Han.num($("#hargaJual").val()),
                hpp: b ? Han.num(b.hargaBeli) : 0,
                pelanggan: $("#pelanggan").val().trim(),
                ket: $("#ket").val().trim()
            };
            var list = Han.listKeluar();
            if (editId) {
                list = list.map(function (x) { return String(x.id) === String(editId) ? rec : x; });
            } else {
                list.push(rec);
            }
            Han.write(Han.KEYS.keluar, list);
            $("#formModal").modal("hide");
            render();
        });

        $("#kode").on("change", function () {
            var b = Han.getBarang($(this).val());
            if (b && !editId) $("#hargaJual").val(b.hargaJual || 0);
            infoStok();
        });

        $("#cari").on("input", render);

        $(document).on("click", ".btn-edit", function () {
            var id = $(this).attr("data-id");
            var k = Han.listKeluar().filter(function (x) { return String(x.id) === String(id); })[0];
            if (!k) { alert("Data tidak ditemukan."); return; }
            editId = k.id;
            $("#kode").html(Han.barangOptions(k.kode));
            $("#tanggal").val(k.tanggal);
            $("#jumlah").val(k.jumlah);
            $("#hargaJual").val(k.hargaJual);
            $("#pelanggan").val(k.pelanggan || "");
            $("#ket").val(k.ket || "");
            infoStok();
            $("#formTitle").text("Ubah Barang Keluar");
            $("#formModal").modal("show");
        });

        $(document).on("click", ".btn-hapus", function () {
            if (!confirm("Hapus transaksi ini?")) return;
            var id = $(this).attr("data-id");
            Han.write(Han.KEYS.keluar, Han.listKeluar().filter(function (x) { return String(x.id) !== String(id); }));
            render();
        });

        render();
    </script>

</body>

</html>
